name: Sito vetrina

# La landing page pubblica del progetto su GitHub Pages. Il sito sta in
# `sito/` (HTML + CSS puri); gli screenshot dell'app arrivano da
# `docs/screenshots/`, copiati nell'artefatto per rendere il deploy
# autonomo dal resto del repository.

on:
  push:
    branches: ["main"]
    paths: ["sito/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compone il sito (schermate incluse, in WebP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          mkdir -p _site/screenshots
          cp -r sito/* _site/
          for f in docs/screenshots/*.png; do
            cwebp -q 82 -quiet "$f" -o "_site/screenshots/$(basename "${f%.png}.webp")"
          done
          # dashboard.png resta anche in PNG: è l'immagine dei meta tag social
          cp docs/screenshots/dashboard.png _site/screenshots/dashboard.png

      - name: Controlli di struttura
        run: |
          test -f _site/index.html
          test -f _site/style.css
          test -f _site/404.html
          test -f _site/screenshots/dashboard.webp
          test -f _site/screenshots/dashboard.png
          grep -q "screenshots/" _site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4