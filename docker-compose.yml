services:
  vettore:
    build: .
    ports:
      # Solo loopback: è una demo senza vera autenticazione, non va esposta in rete.
      - "127.0.0.1:8080:8080"
    volumes:
      - vettore-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vettore-data:
